spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USER:app}
    password: ${DB_PASS:app}
  jpa:
    hibernate:
      ddl-auto: validate
app:
  user: ${APP_USER}
  password: ${APP_PASSWORD}
  jwt-secret: ${APP_JWT_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: health
