spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USER:app}
    password: ${DB_PASS:app}
  jpa:
    hibernate:
      ddl-auto: validate
app:
  jwt-secret: ${APP_JWT_SECRET}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  token-key: ${TOKEN_ENCRYPTION_KEY:}
  casparser-key: ${CASPARSER_API_KEY:}
management:
  endpoints:
    web:
      exposure:
        include: health
